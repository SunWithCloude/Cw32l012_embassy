name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TARGET: thumbv6m-none-eabi

jobs:
  build:
    name: build / test / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # 裸机目标：库 + 两个示例，任何警告都算失败
      - name: clippy (thumbv6m, rt, examples)
        run: cargo clippy --target $TARGET --release --features rt --examples -- -D warnings

      - name: build (thumbv6m, rt, examples)
        run: cargo build --target $TARGET --release --features rt --examples

      # 宿主机测试（dev-dependencies 已按目标门控，不会拉 cortex-m 平台代码）
      - name: host tests
        run: cargo test

      - name: rustfmt
        # -p 限定只查本包（本仓文件）
        run: cargo fmt -p embassy-cw32 -- --check

  # 11 家族互斥 feature 各自编译(经典组 PAC 来自 crates.io 发布版)
  family-matrix:
    name: family / ${{ matrix.family }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        family: [cw32l012, cw32l010, cw32l011, cw32f030, cw32l031, cw32l052, cw32l083, cw32r031, cw32w031, cw32f020, cw32f003]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi

      - uses: Swatinem/rust-cache@v2

      - name: check (${{ matrix.family }})
        run: cargo check --target $TARGET --no-default-features --features "critical-section-impl,${{ matrix.family }}"


  # defmt feature 开启态(错误类型 Format derive 的编译保障)
  defmt:
    name: defmt-on check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target $TARGET --no-default-features --features "critical-section-impl,cw32l012,defmt"

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo doc
        run: cargo doc --no-deps --features rt
